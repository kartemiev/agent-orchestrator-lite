name: Bug report
description: Report a bug or unexpected behaviour.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered steps that trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
  - type: input
    id: workflow_id
    attributes:
      label: workflow_id
      description: The ID of the affected sprint, if applicable.
      placeholder: direct-plan-...
  - type: textarea
    id: diagnose
    attributes:
      label: agent-cli.py diagnose output
      description: Paste the output of `python3 scripts/agent-cli.py diagnose <workflow_id>`.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker and Docker Compose versions, LLM provider/model.
      placeholder: |
        - OS: Ubuntu 24.04
        - Docker: 27.x
        - Compose: v2.x
        - Model: deepseek-v4-pro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Relevant logs with secrets removed.
      render: text
